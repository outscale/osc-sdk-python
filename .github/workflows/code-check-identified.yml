name: Code check On outscale

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  code-check:
    runs-on: [vault]
    if: "! contains(github.event.pull_request.labels.*.name, 'dependencies')"
    steps:
      - name: 🔒️ Import Secrets
        id: import-secrets
        uses: hashicorp/vault-action@v2
        with:
          url: http://127.0.0.1:8200/
          method: jwt
          path: github-action
          exportEnv: false
          outputToken: true
          role: outscale-osc-sdk-python
          secrets: |
            osc-oak/root-creds/outscale-osc-sdk-python access_key | OSC_ACCESS_KEY ;
            osc-oak/root-creds/outscale-osc-sdk-python secret_key | OSC_SECRET_KEY ;
            osc-oak/config region | OSC_REGION ;

      - name: 🧹 Frieza
        uses: outscale/frieza-github-actions/frieza-clean@68ffd39d7e181f3548369e332242b329b04a3182 # master
        with:
          access_key: ${{ steps.import-secrets.outputs.OSC_ACCESS_KEY }}
          secret_key: ${{ steps.import-secrets.outputs.OSC_SECRET_KEY }}
          region: ${{ steps.import-secrets.outputs.OSC_REGION }}
          post_script: |
            curl -XPOST -sv \
            -H "X-Vault-Token: ${{ steps.import-secrets.outputs.vault_token }}" \
            http://127.0.0.1:8200/v1/auth/token/revoke-self

      - name: ⬇️ Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup toolchain
        uses: ./.github/actions/setup-test
      - name: 🧪 Run integration tests
        env:
          OSC_ACCESS_KEY: ${{ steps.import-secrets.outputs.OSC_ACCESS_KEY }}
          OSC_SECRET_KEY: ${{ steps.import-secrets.outputs.OSC_SECRET_KEY }}
          OSC_REGION: ${{ steps.import-secrets.outputs.OSC_REGION }}
        run: make test-int
