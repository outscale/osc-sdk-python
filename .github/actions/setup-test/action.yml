name: Setup code checks
description: "Setup toolchain and run smoke test"

inputs:
  python-version:
    description: 'Python version to use'
    required: false

runs:
  using: composite
  steps:
    - name: ⬇️ Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - name: ⬇️  Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version || '3.14' }}
    - name: ⬇️ Build python package
      run: make package
      shell: bash

