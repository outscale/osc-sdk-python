openapi: 3.1.0
info:
  title: OKS API
  description: |-
    The OKS API enables you to interact with OUTSCALE Kubernetes as a Service (OKS), a managed Kubernetes service on the OUTSCALE Cloud.

    In OKS, each cluster is linked to a project. In a project, you can have several clusters. Templates are also available for different resources.<br />For more information about the service, see [About OKS](https://docs.outscale.com/en/userguide/About-OKS.html).

    An OpenAPI description of this API is also available for download: <button>[oks.yaml](https://docs.outscale.com/_attachments/oks.yaml)</button>
  version: '1.0'
paths:
  /projects:
    post:
      tags:
      - Projects
      summary: Create Project
      description: Creates a new project.
      operationId: CreateProject
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: The HTTP 200 response (OK).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: The HTTP 403 response (Forbidden).
          content:
            application/json:
              example:
                Errors:
                - Type: ForbiddenError
                  Details: You cannot have more than 2 projects.
                  Code: '403'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The HTTP 409 response (Conflict).
          content:
            application/json:
              example:
                Errors:
                - Type: ResourceConflict
                  Details: Project with this name already exists.
                  Code: '409'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The HTTP 422 response (Unprocessable Content).
          content:
            application/json:
              example:
                Errors:
                - Type: ValidationError
                  Details: 'Invalid CIDR: ''10.50.15.24/32'' must have a prefix length between /16 and /23.'
                  Code: '422'
                - Type: ValidationError
                  Details:
                  - loc:
                    - string
                    - 0
                    msg: string
                    type: string
                  Code: '422'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: The HTTP 423 response (Locked Resource).
          content:
            application/json:
              example:
                Errors:
                - Type: LockedResource
                  Details: The project has been under maintenance for 15 mins. Please, try again later
                  Code: '423'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The HTTP 500 response (Internal Server Error).
          content:
            application/json:
              example:
                Errors:
                - Type: InternalError
                  Details: Failed to create project
                  Code: '500'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The HTTP 503 response (Service Unavailable).
          content:
            application/json:
              example:
                Errors:
                - Type: ResourceIsNotReady
                  Details: The service has been under global maintenance for 15 mins. Please, try again later
                  Code: '503'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Projects
      summary: Get Projects
      description: Lists one or more of your projects. The response can be filtered using the parameters.
      operationId: ListProjects
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description: The name of the projects.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        description: The status of the projects (`pending` | `ready` | `updating` | `failed` | `deleting`).
      - name: cidr
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cidr
        description: The IP ranges for the projects, IN CIDR notation (for example, `192.0.2.0/16`).
      - name: deleted
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Deleted
        description: If true, returns deleted projects.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
        description: The token to indicate where the next set of results should start.
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        description: The page number of results to retrieve.
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 1
          - type: 'null'
          title: Limit
        description: The maximum number of results to return in the response.
      responses:
        '200':
          description: The HTTP 200 response (OK).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseList'
        '422':
          description: The HTTP 422 response (Unprocessable Content).
          content:
            application/json:
              example:
                Errors:
                - Type: ValidationError
                  Details:
                  - loc:
                    - string
                    - 0
                    msg: string
                    type: string
                  Code: '422'
                ResponseContext:
                  RequestId: 45a64090-2e5b-428f-bfea-83a5f783f9e6
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
